# Vérifie analyze + test sur chaque push et pull request vers master
# Check informatif : n'empêche pas un push ou un merge en cas d'échec

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
