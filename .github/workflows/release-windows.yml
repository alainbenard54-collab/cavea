# SPDX-License-Identifier: Apache-2.0
# Publie automatiquement l'installateur Windows sur GitHub Releases
# Déclencheur : git tag v* poussé sur origin
#
# Usage :
#   git tag v1.0.0
#   git push origin v1.0.0

name: Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # nécessaire pour créer/modifier la release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # URLs publiques (GitHub Pages), pas de secret — nécessaires pour que
        # le bouton "Importer les données exemple" apparaisse (voir
        # SampleDataService.isConfigured dans CLAUDE.md).
        run: >
          flutter build windows --release
          --dart-define=SAMPLE_DATA_URL_FR=https://cavea.abapps.fr/sample/cavea_sample_fr.csv
          --dart-define=SAMPLE_DATA_URL_EN=https://cavea.abapps.fr/sample/cavea_sample_en.csv

      - name: Write OAuth credentials
        # Fichiers gitignorés, absents du checkout CI — sans cette étape, cavea.iss
        # les copie silencieusement en "skipifsourcedoesntexist" et l'installateur
        # publié n'a jamais le mode partagé (Drive/Dropbox) fonctionnel.
        # N'écrit rien si le secret n'est pas configuré (garde skipifsourcedoesntexist
        # utile en filet de sécurité plutôt que de bundler un fichier vide/invalide).
        shell: pwsh
        env:
          GOOGLE_DESKTOP_SECRETS_JSON: ${{ secrets.GOOGLE_DESKTOP_SECRETS_JSON }}
          DROPBOX_DESKTOP_SECRETS_JSON: ${{ secrets.DROPBOX_DESKTOP_SECRETS_JSON }}
        run: |
          if ($env:GOOGLE_DESKTOP_SECRETS_JSON) {
            Set-Content -Path google_desktop_secrets.json -Value $env:GOOGLE_DESKTOP_SECRETS_JSON -NoNewline
          }
          if ($env:DROPBOX_DESKTOP_SECRETS_JSON) {
            Set-Content -Path dropbox_desktop_secrets.json -Value $env:DROPBOX_DESKTOP_SECRETS_JSON -NoNewline
          }

      - name: Build installer (Inno Setup)
        run: iscc windows\packaging\cavea.iss

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Crée la release si elle n'existe pas, sinon ajoute l'asset
          files: windows/packaging/output/Cavea-*-windows-setup.exe
          fail_on_unmatched_files: true
